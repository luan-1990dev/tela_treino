name: tela_treino
description: "Tela de apoio a treino"
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: '>=3.10.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  google_sign_in: ^6.3.0

  cupertino_icons: ^1.0.9
  sqflite: ^2.4.1
  path: ^1.9.1
  pip_view: ^0.9.7
  vibration: ^3.1.8
  shared_preferences: ^2.5.5
  http: ^1.2.1
  url_launcher: ^6.3.0
  fl_chart: ^0.69.2
  flutter_ringtone_player: ^4.0.0+4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png
